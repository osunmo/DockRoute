services:
  app:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    command: [python, -u, -c, "import time; time.sleep(3600)"]
    environment:
      UPSTREAM_URL: http://api:8000
    depends_on: [api]
  api:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    command:
      - python
      - -u
      - -c
      - "from http.server import BaseHTTPRequestHandler,HTTPServer\nclass H(BaseHTTPRequestHandler):\n def do_GET(self):\n  self.send_response(500); self.end_headers(); self.wfile.write(b'fixture error')\nHTTPServer(('0.0.0.0',8000),H).serve_forever()"
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8000),1).close()"]
      interval: 2s
      timeout: 2s
      retries: 5
