services:
  app:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    command: [python, -c, "raise SystemExit(1)"]
    restart: always
    environment:
      UPSTREAM_URL: http://api:8000
    depends_on: [api]
  api:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    command: [python, -m, http.server, "8000", --bind, 0.0.0.0]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8000),1).close()"]
      interval: 2s
      timeout: 2s
      retries: 5
