name: Linux Docker regression evidence
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions per expanded scenario (1-100)
        type: number
        default: 10
        required: true
  workflow_call:
    inputs:
      runs:
        type: number
        default: 10
permissions:
  contents: read
jobs:
  docker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan source for secrets
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          (cd "$RUNNER_TEMP" && grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums.txt | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,binary]"
      - run: python -m pytest -q --junitxml=outputs/linux-tests.xml
      - run: python -m pip freeze > outputs/python-dependencies.txt
      - run: python scripts/build_binary.py --output outputs
      - name: Prepare pinned fixture and helper image
        run: |
          docker pull python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          docker tag python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4 python:3.12-alpine
          docker version
          docker compose version
          ./outputs/dockroute --version
      - name: Original six regression scenarios
        run: python scripts/benchmark.py --binary ./outputs/dockroute --allow-fixed-ports --output outputs/original-six.json
      - name: Expanded synthetic regression scenarios
        env:
          DOCKROUTE_RUNS: ${{ inputs.runs }}
        run: python scripts/benchmark_accuracy.py --binary ./outputs/dockroute --runs "$DOCKROUTE_RUNS" --allow-fixed-ports --output outputs/expanded-regression.json
      - name: Package credential-free synthetic evidence
        if: always()
        run: |
          python -c "from pathlib import Path; import zipfile; paths=[*Path('outputs').glob('*.json'),*Path('outputs').glob('*.xml'),*Path('outputs').glob('*.txt'),*(p for p in Path('work/accuracy-raw').rglob('*') if p.is_file())]; z=zipfile.ZipFile('outputs/diagnostic-evidence.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.as_posix()) for p in paths]; z.close()"
          sha256sum outputs/diagnostic-evidence.zip > outputs/diagnostic-evidence.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-diagnostic-evidence
          path: |
            outputs/diagnostic-evidence.zip
            outputs/diagnostic-evidence.zip.sha256
