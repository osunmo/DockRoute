[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockroute"
version = "0.4.1"
description = "Networking linter for Docker Compose projects with optional TCP probes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "DockRoute contributors"}]
dependencies = ["docker>=7.2,<8", "PyYAML>=6.0.2,<7", "pywin32>=306; sys_platform == 'win32'"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2", "jsonschema>=4,<5", "mypy>=1,<2", "types-PyYAML>=6,<7"]
binary = ["pyinstaller>=6,<7"]

[project.scripts]
dockroute = "dockroute.cli:main"
dockroute-benchmark = "dockroute.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: live Docker scenarios (explicit opt-in)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
