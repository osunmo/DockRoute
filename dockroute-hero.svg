<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">DockRoute — Find the broken link</title>
  <desc id="desc">An illustrated network of Docker Compose services: app, API, and database, with a highlighted disconnected link detected by DockRoute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a2a"/>
      <stop offset="0.52" stop-color="#101d30"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6EF0D6"/>
      <stop offset="1" stop-color="#70B7FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#52e7c9" stop-opacity=".15"/>
      <stop offset="1" stop-color="#52e7c9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6d8ca8" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#030910" flood-opacity=".35"/>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="370" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="370" rx="22" fill="url(#grid)"/>
  <rect x="610" y="-60" width="580" height="490" fill="url(#glow)"/>
  <path d="M0 310 C210 255 302 350 455 310 S762 280 1200 350" fill="none" stroke="#6ef0d6" stroke-opacity=".075" stroke-width="2"/>
  <path d="M0 332 C240 260 298 374 510 320 S838 292 1200 360" fill="none" stroke="#70b7ff" stroke-opacity=".065" stroke-width="2"/>

  <!-- headline -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="78" font-size="13" fill="#8BA5BE" letter-spacing="3">OPEN SOURCE  /  DOCKER COMPOSE DIAGNOSTICS</text>
    <rect x="64" y="101" width="44" height="4" rx="2" fill="#6EF0D6"/>
    <text x="60" y="183" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-3" fill="#F2F7FB">Dock</text>
    <text x="252" y="183" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-3" fill="url(#teal)">Route</text>
    <text x="65" y="225" font-size="24" font-weight="600" fill="#E1EBF6">Find the broken link.</text>
    <text x="65" y="255" font-size="15" fill="#99B0C5">Map connections. Trace failures. Explain why.</text>
  </g>

  <!-- mini feature pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing=".55">
    <rect x="64" y="292" width="182" height="32" rx="16" fill="#17384A" stroke="#2F7F83" stroke-opacity=".65"/>
    <circle cx="81" cy="308" r="4" fill="#6EF0D6"/>
    <text x="95" y="312" fill="#BFEFE6">READ-ONLY INSPECTION</text>
    <rect x="257" y="292" width="172" height="32" rx="16" fill="#203046" stroke="#54708A" stroke-opacity=".7"/>
    <circle cx="274" cy="308" r="4" fill="#F7B979"/>
    <text x="288" y="312" fill="#DAE5F2">OPT-IN TCP PROBES</text>
  </g>

  <!-- topology canvas -->
  <rect x="590" y="54" width="552" height="264" rx="18" fill="#0D1625" stroke="#547493" stroke-opacity=".32" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M608 93 H1123" stroke="#51708D" stroke-opacity=".29"/>
  <circle cx="615" cy="76" r="4" fill="#E98C89"/>
  <circle cx="633" cy="76" r="4" fill="#EFC06E"/>
  <circle cx="651" cy="76" r="4" fill="#6ED6B8"/>
  <text x="677" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#87A0B9">service-map / ecommerce</text>
  <text x="1105" y="80" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#59788F">● LIVE GRAPH</text>

  <!-- connection edges -->
  <path d="M758 174 C795 174 805 174 835 174" fill="none" stroke="#FB997F" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <circle cx="798" cy="174" r="20" fill="#2A2430" stroke="#FC9B87" stroke-width="1.6"/>
  <path d="M792 168 L804 180 M804 168 L792 180" stroke="#FFAB90" stroke-width="3.3" stroke-linecap="round"/>
  <path d="M966 174 C1000 174 998 235 1021 235" fill="none" stroke="#70E5CA" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="998" cy="199" r="4" fill="#70E5CA"/>
  <circle cx="998" cy="199" r="12" fill="#70E5CA" opacity=".13" filter="url(#softglow)"/>

  <!-- cards -->
  <rect x="621" y="133" width="137" height="82" rx="12" fill="#14273B" stroke="#517B93" stroke-width="1.5"/>
  <rect x="632" y="145" width="29" height="29" rx="7" fill="#284C60"/>
  <path d="M639 156 h16 m-16 6 h10" stroke="#92E5DF" stroke-width="2" stroke-linecap="round"/>
  <text x="669" y="162" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#ECF8FF" font-weight="700">app</text>
  <text x="634" y="198" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8BACC2">network: front</text>

  <rect x="835" y="133" width="131" height="82" rx="12" fill="#14273B" stroke="#517B93" stroke-width="1.5"/>
  <rect x="846" y="145" width="29" height="29" rx="7" fill="#284C60"/>
  <path d="M854 155 L860 160 L854 165 M863 165 h5" stroke="#92E5DF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="884" y="162" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#ECF8FF" font-weight="700">api</text>
  <text x="848" y="198" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8BACC2">network: back</text>

  <rect x="1021" y="198" width="99" height="78" rx="12" fill="#14273B" stroke="#517B93" stroke-width="1.5"/>
  <ellipse cx="1044" cy="222" rx="11" ry="5" fill="none" stroke="#95DDCD" stroke-width="2"/>
  <path d="M1033 222 v14 q11 10 22 0 v-14 M1033 229 q11 8 22 0" fill="none" stroke="#95DDCD" stroke-width="2"/>
  <text x="1063" y="228" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ECF8FF">db</text>
  <text x="1032" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8BACC2">:5432</text>

  <!-- detection status -->
  <rect x="625" y="240" width="337" height="48" rx="10" fill="#2A2530" stroke="#B66C64" stroke-opacity=".7"/>
  <circle cx="642" cy="264" r="4" fill="#FAA58F"/>
  <text x="655" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#F3C1AE" font-weight="700">NETWORK_ISOLATION</text>
  <text x="655" y="274" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.8" fill="#CAB0B1">app and api share no network</text>

  <rect x="0.6" y="0.6" width="1198.8" height="368.8" rx="21.5" fill="none" stroke="#7294AD" stroke-opacity=".3" stroke-width="1.2"/>
</svg>
