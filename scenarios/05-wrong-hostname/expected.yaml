scenario: 05-wrong-hostname
description: api-backend does not identify the api service in the Compose network.
intended_edge:
  source_service: app
  destination_service: api
  destination_port: 8000
observed_config:
  env_name: UPSTREAM_URL
  env_value: http://api-backend:8000
expected_diagnosis: INVALID_SERVICE_HOSTNAME
expected_app_health: unhealthy
expected_api_health: healthy
recommended_fix: Use http://api:8000 or configure an explicit network alias.
scratch_verification_safe_if_no_external_resources: true
notes: Test expectation written before competing tools are run; classification is
  not a measured tool result.
